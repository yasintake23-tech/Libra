name: Libra Cloudflare R2 Worker

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare/r2-worker/**"
      - ".github/workflows/cloudflare-r2-worker.yml"
  pull_request:
    branches:
      - main
    paths:
      - "cloudflare/r2-worker/**"
      - ".github/workflows/cloudflare-r2-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate R2 Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: cloudflare/r2-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Wrangler dry run
        env:
          FIREBASE_WEB_API_KEY: validation-only
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run

      - name: Show generated bundle
        run: |
          test -n "$(find .wrangler-dry-run -type f -maxdepth 2 -print -quit)"
          find .wrangler-dry-run -maxdepth 2 -type f -print

  deploy:
    name: Deploy R2 Worker
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: cloudflare/r2-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare Firebase web API key
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.GOOGLE_SERVICES_JSON_B64 != '' }}
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > /tmp/google-services.json
          FIREBASE_WEB_API_KEY="$(python3 -c 'import json; print(json.load(open("/tmp/google-services.json"))["client"][0]["api_key"][0]["current_key"])')"
          printf '%s' "$FIREBASE_WEB_API_KEY" | npx wrangler secret put FIREBASE_WEB_API_KEY --name libra-r2-worker

      - name: Deploy Worker
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.GOOGLE_SERVICES_JSON_B64 != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --name libra-r2-worker

      - name: Deployment skipped
        if: ${{ !(secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.GOOGLE_SERVICES_JSON_B64 != '') }}
        run: |
          echo "::warning::Cloudflare deploy skipped. Configure CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and GOOGLE_SERVICES_JSON_B64 repository secrets."
