name: Libra Android APK
# Profile/storage reliability fixes build marker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: libra-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  GRADLE_VERSION: '9.3.1'
  EXPECTED_LIBRA_SHA1: 'f322c7e4a951958d463972db788399aef1b8764f'

jobs:
  build-apk:
    name: Build and Package APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Libra
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      - name: Prepare fixed signing key
        shell: bash
        run: |
          set -euo pipefail

          LIBRA_SIGNING_VALUE="${{ secrets.LIBRA_SIGNING_VALUE }}"
          if [[ -z "$LIBRA_SIGNING_VALUE" ]]; then
            LIBRA_SIGNING_VALUE="${{ vars.LIBRA_SIGNING_VALUE }}"
          fi

          [[ -n "$LIBRA_SIGNING_VALUE" ]] || {
            echo "::error::LIBRA_SIGNING_VALUE secret veya repository variable eksik."
            exit 1
          }

          # Repository variables are not automatically masked in Actions logs.
          # Mask the signing value before exporting it for Gradle.
          echo "::add-mask::$LIBRA_SIGNING_VALUE"

          mkdir -p "$RUNNER_TEMP/libra-signing"
          base64 --decode signing/libra-signing.jks.b64 > "$RUNNER_TEMP/libra-signing/libra.jks"
          test -s "$RUNNER_TEMP/libra-signing/libra.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/libra-signing/libra.jks" \
            -storepass "$LIBRA_SIGNING_VALUE" \
            -alias "libra" >/dev/null

          {
            echo "LIBRA_SIGNING_PATH=$RUNNER_TEMP/libra-signing/libra.jks"
            echo "LIBRA_SIGNING_VALUE=$LIBRA_SIGNING_VALUE"
            echo "LIBRA_SIGNING_ALIAS=libra"
          } >> "$GITHUB_ENV"

          echo "Sabit Libra signing key doğrulandı."

      - name: Verify committed Firebase config
        shell: bash
        run: |
          set -euo pipefail
          test -s app/google-services.json
          grep -q '"project_id": "libra-3bfb9"' app/google-services.json
          grep -q '"package_name": "com.libra.app"' app/google-services.json

      - name: Inject R2 Worker endpoint
        shell: bash
        env:
          R2_WORKER_ENDPOINT: ${{ secrets.R2_WORKER_ENDPOINT || vars.R2_WORKER_ENDPOINT }}
        run: |
          set -euo pipefail

          if [[ -z "$R2_WORKER_ENDPOINT" ]]; then
            echo "::warning::R2_WORKER_ENDPOINT tanımlı değil. APK build devam edecek ve uygulamadaki Firebase Storage fallback kullanılacak."
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path
          from xml.sax.saxutils import escape
          import os
          import re

          path = Path("app/src/main/res/values/strings.xml")
          endpoint = os.environ["R2_WORKER_ENDPOINT"].strip().rstrip("/")
          content = path.read_text(encoding="utf-8")

          pattern = r'(<string name="r2_upload_endpoint">)(.*?)(</string>)'
          updated, count = re.subn(
              pattern,
              lambda m: m.group(1) + escape(endpoint) + m.group(3),
              content,
              count=1,
              flags=re.DOTALL,
          )

          if count != 1:
              raise SystemExit("r2_upload_endpoint kaynağı bulunamadı.")
          path.write_text(updated, encoding="utf-8")
          PY

          echo "R2 Worker endpoint APK derlemesine enjekte edildi."

      - name: Verify direct Cloudflare R2 access
        shell: bash
        env:
          CLOUDFLARE_R2_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
        run: |
          set -euo pipefail

          python3 - <<'PY' > "$RUNNER_TEMP/r2.env"
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = ET.parse("app/src/main/res/values/strings.xml").getroot()
          values = {
              node.attrib["name"]: (node.text or "").strip()
              for node in root.findall("string")
          }

          endpoint = values.get("r2_upload_endpoint", "")
          account = values.get("cloudflare_r2_account_id", "")
          bucket = values.get("cloudflare_r2_bucket_name", "")
          print("R2_ENDPOINT=" + endpoint)
          print("R2_ACCOUNT=" + account)
          print("R2_BUCKET=" + bucket)
          PY

          set -a
          source "$RUNNER_TEMP/r2.env"
          set +a

          if [[ -z "$R2_ENDPOINT" ]]; then
            echo "::warning::R2 Worker endpoint yok. Direct R2 doğrulaması atlandı; uygulama Firebase Storage fallback ile derlenecek."
            exit 0
          fi

          if [[ -z "$CLOUDFLARE_R2_API_TOKEN" ]]; then
            echo "::warning::CLOUDFLARE_R2_API_TOKEN yok. Direct R2 doğrulaması atlandı; uygulama yine Firebase Storage fallback'i kullanabilir."
            exit 0
          fi

          echo "::add-mask::$CLOUDFLARE_R2_API_TOKEN"
          API_BASE="https://api.cloudflare.com/client/v4/accounts/$R2_ACCOUNT/r2/buckets/$R2_BUCKET/objects"
          TEST_KEY="_ci/libra-$GITHUB_RUN_ID.txt"
          printf '%s\n' 'libra-r2-ci' > "$RUNNER_TEMP/r2-test.txt"

          curl --fail --silent --show-error             --request PUT             --header "Authorization: Bearer $CLOUDFLARE_R2_API_TOKEN"             --header "Content-Type: text/plain"             --data-binary @"$RUNNER_TEMP/r2-test.txt"             "$API_BASE/$TEST_KEY" > "$RUNNER_TEMP/r2-put.json"

          python3 - <<'PY' "$RUNNER_TEMP/r2-put.json"
          import json
          import sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          if payload.get("success") is not True:
              raise SystemExit("R2 PUT başarısız: " + repr(payload))
          print("Direct R2 PUT başarılı.")
          PY

          curl --fail --silent --show-error             --request GET             --header "Authorization: Bearer $CLOUDFLARE_R2_API_TOKEN"             "$API_BASE/$TEST_KEY" > "$RUNNER_TEMP/r2-get.txt"

          cmp "$RUNNER_TEMP/r2-test.txt" "$RUNNER_TEMP/r2-get.txt" || {
            echo "::error::R2 GET doğrulaması PUT edilen içerikle eşleşmiyor."
            exit 1
          }
          echo "Direct R2 GET başarılı."

          curl --fail --silent --show-error             --request DELETE             --header "Authorization: Bearer $CLOUDFLARE_R2_API_TOKEN"             "$API_BASE/$TEST_KEY" > "$RUNNER_TEMP/r2-delete.json"

          python3 - <<'PY' "$RUNNER_TEMP/r2-delete.json"
          import json
          import sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          if payload.get("success") is not True:
              raise SystemExit("R2 DELETE başarısız: " + repr(payload))
          print("Direct R2 DELETE başarılı.")
          PY

      - name: Show toolchain
        shell: bash
        run: |
          set -euo pipefail
          java --version
          gradle --version

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon --console=plain

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon --console=plain

      - name: Verify Firebase signing certificate
        id: verify_signing
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"

          if [[ -z "$APKSIGNER" ]]; then
            echo "::error::apksigner bulunamadı."
            exit 1
          fi

          set +x
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK_PATH" 2>&1)"
          set -x

          ACTUAL_SHA1="$(printf '%s\n' "$CERT_OUTPUT" | sed -nE 's/.*certificate SHA-1 digest: ([0-9A-Fa-f:]+).*/\1/p' | head -n1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          ACTUAL_SHA256="$(printf '%s\n' "$CERT_OUTPUT" | sed -nE 's/.*certificate SHA-256 digest: ([0-9A-Fa-f:]+).*/\1/p' | head -n1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"

          echo "Expected SHA-1: $EXPECTED_LIBRA_SHA1"
          echo "Actual SHA-1:   $ACTUAL_SHA1"
          echo "APK SHA-256:    $ACTUAL_SHA256"

          if [[ -z "$ACTUAL_SHA1" ]]; then
            echo "::error::APK sertifika SHA-1 değeri okunamadı."
            printf '%s\n' "$CERT_OUTPUT"
            exit 1
          fi

          if [[ "$ACTUAL_SHA1" != "$EXPECTED_LIBRA_SHA1" ]]; then
            echo "::error::APK Firebase'de kayıtlı Libra SHA-1 ile eşleşmiyor."
            exit 1
          fi

          echo "Firebase-matched signing certificate doğrulandı."
          echo "sha1=$ACTUAL_SHA1" >> "$GITHUB_OUTPUT"
          echo "sha256=$ACTUAL_SHA256" >> "$GITHUB_OUTPUT"

      - name: Verify APK
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          [[ -f "$APK_PATH" ]] || { echo "::error::APK bulunamadı."; exit 1; }

          APK_SIZE=$(stat -c%s "$APK_PATH")
          SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          mkdir -p artifacts
          cp "$APK_PATH" "artifacts/Libra-debug-$GITHUB_RUN_NUMBER.apk"

          cat > artifacts/build-info.txt <<EOF
          Libra Android Build
          ===================
          Run: $GITHUB_RUN_NUMBER
          Commit: $GITHUB_SHA
          Ref: $GITHUB_REF
          Build date: $BUILD_DATE
          APK size: $APK_SIZE bytes
          APK SHA-256: $SHA256
          Signing SHA-1: ${{ steps.verify_signing.outputs.sha1 }}
          Signing SHA-256: ${{ steps.verify_signing.outputs.sha256 }}
          Package: com.libra.app
          Version: 1.0.0 (1)
          EOF

          echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Libra-APK-${{ github.run_number }}
          path: artifacts/Libra-debug-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: Libra-Build-Info-${{ github.run_number }}
          path: artifacts/build-info.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: Libra-Test-Reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Build summary
        if: ${{ success() }}
        shell: bash
        run: |
          {
            echo "## Libra APK"
            echo ""
            echo "Debug APK başarıyla oluşturuldu."
            echo ""
            echo "- Artifact: Libra-APK-$GITHUB_RUN_NUMBER"
            echo "- Package: com.libra.app"
            echo "- Signing SHA-1: ${{ steps.verify_signing.outputs.sha1 }}"
            echo "- APK size: ${{ steps.verify_apk.outputs.apk_size }} bytes"
            echo "- APK SHA-256: ${{ steps.verify_apk.outputs.sha256 }}"
          } >> "$GITHUB_STEP_SUMMARY"
