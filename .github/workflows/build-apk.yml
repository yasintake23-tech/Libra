name: Libra Android APK
# Profile/storage reliability fixes build marker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: libra-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  GRADLE_VERSION: '9.3.1'
  EXPECTED_LIBRA_SHA1: 'f322c7e4a951958d463972db788399aef1b8764f'

jobs:
  build-apk:
    name: Build and Package APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Libra
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      - name: Prepare fixed signing key
        shell: bash
        run: |
          set -euo pipefail

          LIBRA_SIGNING_VALUE="${{ secrets.LIBRA_SIGNING_VALUE }}"
          if [[ -z "$LIBRA_SIGNING_VALUE" ]]; then
            LIBRA_SIGNING_VALUE="${{ vars.LIBRA_SIGNING_VALUE }}"
          fi

          [[ -n "$LIBRA_SIGNING_VALUE" ]] || {
            echo "::error::LIBRA_SIGNING_VALUE secret veya repository variable eksik."
            exit 1
          }

          # Repository variables are not automatically masked in Actions logs.
          # Mask the signing value before exporting it for Gradle.
          echo "::add-mask::$LIBRA_SIGNING_VALUE"

          mkdir -p "$RUNNER_TEMP/libra-signing"
          base64 --decode signing/libra-signing.jks.b64 > "$RUNNER_TEMP/libra-signing/libra.jks"
          test -s "$RUNNER_TEMP/libra-signing/libra.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/libra-signing/libra.jks" \
            -storepass "$LIBRA_SIGNING_VALUE" \
            -alias "libra" >/dev/null

          {
            echo "LIBRA_SIGNING_PATH=$RUNNER_TEMP/libra-signing/libra.jks"
            echo "LIBRA_SIGNING_VALUE=$LIBRA_SIGNING_VALUE"
            echo "LIBRA_SIGNING_ALIAS=libra"
          } >> "$GITHUB_ENV"

          echo "Sabit Libra signing key doğrulandı."

      - name: Verify committed Firebase config
        shell: bash
        run: |
          set -euo pipefail
          test -s app/google-services.json
          grep -q '"project_id": "libra-3bfb9"' app/google-services.json
          grep -q '"package_name": "com.libra.app"' app/google-services.json

      - name: Inject direct R2 S3 configuration
        shell: bash
        env:
          R2_KEY_ID: ${{ secrets.R2_KEY_ID || vars.R2_KEY_ID }}
          R2_SECRET: ${{ secrets.R2_SECRET || vars.R2_SECRET }}
          R2_PUBLIC: ${{ secrets.R2_PUBLIC || vars.R2_PUBLIC }}
        run: |
          set -euo pipefail
          [[ -n "$R2_KEY_ID" ]] || { echo "::error::R2_KEY_ID eksik."; exit 1; }
          [[ -n "$R2_SECRET" ]] || { echo "::error::R2_SECRET eksik."; exit 1; }
          [[ -n "$R2_PUBLIC" ]] || { echo "::error::R2_PUBLIC eksik. Cloudflare R2 public URL gerekli."; exit 1; }
          [[ "$R2_PUBLIC" == https://* ]] || { echo "::error::R2_PUBLIC HTTPS bir URL olmalı."; exit 1; }
          echo "::add-mask::$R2_KEY_ID"
          echo "::add-mask::$R2_SECRET"
          echo "::add-mask::$R2_PUBLIC"

          python3 - <<'PY'
          from pathlib import Path
          from xml.sax.saxutils import escape
          import os
          import re

          path = Path("app/src/main/res/values/strings.xml")
          content = path.read_text(encoding="utf-8")
          values = {
              "cloudflare_r2_access_key_id": os.environ["R2_KEY_ID"].strip(),
              "cloudflare_r2_secret_access_key": os.environ["R2_SECRET"].strip(),
              "cloudflare_r2_public_base_url": os.environ.get("R2_PUBLIC", "").strip().rstrip("/"),
          }

          for name, value in values.items():
              pattern = r'(<string name="' + re.escape(name) + r'">)(.*?)(</string>)'
              content, count = re.subn(
                  pattern,
                  lambda m: m.group(1) + escape(value) + m.group(3),
                  content,
                  count=1,
                  flags=re.DOTALL,
              )
              if count != 1:
                  raise SystemExit(name + " bulunamadı.")

          path.write_text(content, encoding="utf-8")
          PY

      - name: Deploy Realtime Database rules when Firebase token is configured
        shell: bash
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        if: ${{ env.FIREBASE_TOKEN != '' }}
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy --only database --project libra-3bfb9 --token "$FIREBASE_TOKEN" --non-interactive

      - name: Verify backend architecture
        shell: bash
        run: |
          set -euo pipefail
          test ! -d cloudflare/r2-worker
          ! grep -R --line-number --exclude-dir=.git -E 'FirebaseStorageRepositoryImpl|HybridStorageRepositoryImpl|FirebaseStorage|getInstance\\(.*firebase.*storage|libra-r2-worker' app cloudflare 2>/dev/null
          grep -q 'class RealtimeChatRepositoryImpl' app/src/main/java/com/libra/app/data/chat/RealtimeChatRepositoryImpl.kt
          grep -q 'FirebaseDatabase.getInstance' app/src/main/java/com/libra/app/data/chat/RealtimeChatRepositoryImpl.kt
          grep -q 'aws-android-sdk-s3' gradle/libs.versions.toml
          echo "Backend architecture: Firebase Auth/Firestore + RTDB chat + direct Cloudflare R2."

      - name: Show toolchain
        shell: bash
        run: |
          set -euo pipefail
          java --version
          gradle --version

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon --console=plain

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon --console=plain

      - name: Verify Firebase signing certificate
        id: verify_signing
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"

          if [[ -z "$APKSIGNER" ]]; then
            echo "::error::apksigner bulunamadı."
            exit 1
          fi

          set +x
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK_PATH" 2>&1)"
          set -x

          ACTUAL_SHA1="$(printf '%s\n' "$CERT_OUTPUT" | sed -nE 's/.*certificate SHA-1 digest: ([0-9A-Fa-f:]+).*/\1/p' | head -n1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          ACTUAL_SHA256="$(printf '%s\n' "$CERT_OUTPUT" | sed -nE 's/.*certificate SHA-256 digest: ([0-9A-Fa-f:]+).*/\1/p' | head -n1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"

          echo "Expected SHA-1: $EXPECTED_LIBRA_SHA1"
          echo "Actual SHA-1:   $ACTUAL_SHA1"
          echo "APK SHA-256:    $ACTUAL_SHA256"

          if [[ -z "$ACTUAL_SHA1" ]]; then
            echo "::error::APK sertifika SHA-1 değeri okunamadı."
            printf '%s\n' "$CERT_OUTPUT"
            exit 1
          fi

          if [[ "$ACTUAL_SHA1" != "$EXPECTED_LIBRA_SHA1" ]]; then
            echo "::error::APK Firebase'de kayıtlı Libra SHA-1 ile eşleşmiyor."
            exit 1
          fi

          echo "Firebase-matched signing certificate doğrulandı."
          echo "sha1=$ACTUAL_SHA1" >> "$GITHUB_OUTPUT"
          echo "sha256=$ACTUAL_SHA256" >> "$GITHUB_OUTPUT"

      - name: Verify APK
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          [[ -f "$APK_PATH" ]] || { echo "::error::APK bulunamadı."; exit 1; }

          APK_SIZE=$(stat -c%s "$APK_PATH")
          SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          mkdir -p artifacts
          cp "$APK_PATH" "artifacts/Libra-debug-$GITHUB_RUN_NUMBER.apk"

          cat > artifacts/build-info.txt <<EOF
          Libra Android Build
          ===================
          Run: $GITHUB_RUN_NUMBER
          Commit: $GITHUB_SHA
          Ref: $GITHUB_REF
          Build date: $BUILD_DATE
          APK size: $APK_SIZE bytes
          APK SHA-256: $SHA256
          Signing SHA-1: ${{ steps.verify_signing.outputs.sha1 }}
          Signing SHA-256: ${{ steps.verify_signing.outputs.sha256 }}
          Package: com.libra.app
          Version: 1.0.0 (1)
          EOF

          echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Libra-APK-${{ github.run_number }}
          path: artifacts/Libra-debug-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: Libra-Build-Info-${{ github.run_number }}
          path: artifacts/build-info.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: Libra-Test-Reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Build summary
        if: ${{ success() }}
        shell: bash
        run: |
          {
            echo "## Libra APK"
            echo ""
            echo "Debug APK başarıyla oluşturuldu."
            echo ""
            echo "- Artifact: Libra-APK-$GITHUB_RUN_NUMBER"
            echo "- Package: com.libra.app"
            echo "- Signing SHA-1: ${{ steps.verify_signing.outputs.sha1 }}"
            echo "- APK size: ${{ steps.verify_apk.outputs.apk_size }} bytes"
            echo "- APK SHA-256: ${{ steps.verify_apk.outputs.sha256 }}"
          } >> "$GITHUB_STEP_SUMMARY"
